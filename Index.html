<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Adivinhação</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <h1>Jogo de Adivinhação</h1>
    <p>Digite um número de 1 a 100</p>
    <label for="palpite">Seu palpite</label>
    <input type="number" id="palpite" min="1" max="100" placeholder="50">
    <p>
        <button onclick="adivinhar()">Chutar</button>
    </p>
    <p id="resultado"></p>
    <button id="btnReiniciar" style="display:none" onclick="location.reload()">Jogar novamente</button>
    <p id="tentativas">Tentativas restantes: 15</p>
    

    
</body>
</html>
